<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WARena</title>
  <!-- Favicon — player character: colored circle with eye -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%234a9eff'/%3E%3Ccircle cx='32' cy='32' r='28' fill='none' stroke='%231a5ebf' stroke-width='3'/%3E%3Ccircle cx='32' cy='26' r='10' fill='white'/%3E%3Ccircle cx='35' cy='26' r='4.5' fill='black'/%3E%3C/svg%3E">
  <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAYAAABXAvmHAAAACXBIWXMAAAsTAAALEwEAmpwYAAAA5UlEQVR4nO2WMQ6DMBBFv4sUKVKkSJGiRYsWLbpApUiRIkWKNL9fpEiRIkWKNL9f4MdxHGcYhm8QgsBf17btOI7jOI7jOI7j/wYd0Aa7YXGsIyAAmGtE4N+5AXz/BwRBQBAEBEFgTmwRWQK6YJnkAmOvAdgCZpILjL0GYAvYSY7B3u8APAJ2kgOMvQFgC9hJjjD2BoAtYCc5wtgbALaAneQIY28A2AJ2kiOMvQFgC9hJjjD2BoAtYCc5wtgbALaAnSQK/gG+O46jB/qIHWEH9BE7wg7oI3aEHdBH7Ag7oI/YEXZAH7Ej7IA+YkfYAX3EjrAD+ogdYQf0ETvCDugjdqYNdgA5wM7/B8gBdoAdYAfYAXaAHWAH2AF2gB1gB9gBdoAdYAfYAXaAHWAH2AF2gB1gB9gBdoD/DdwBT8Ce+AnYAXaAHWAH2AF2gB1gB9gBdoAdYAfYAXaAHWAH2AF2gB1gB9gBdoAdYAfYAXaA/w3cAU/AnyMfAPkD+e/QfwAAAABJRU5ErkJggg==">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #0a0a0a;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      cursor: crosshair;
      user-select: none;
    }
    
    canvas {
      display: block;
    }
    
    #ui-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    
    #hud {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 30px;
      align-items: center;
    }
    
    .hud-item {
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      padding: 10px 20px;
      color: white;
      font-size: 14px;
      text-align: center;
    }
    
    .hud-item .label {
      font-size: 10px;
      opacity: 0.7;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .hud-item .value {
      font-size: 24px;
      font-weight: bold;
      margin-top: 2px;
    }
    
    #health-bar-container {
      width: 200px;
      height: 16px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 8px;
      overflow: hidden;
      margin-top: 4px;
    }
    
    #health-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ff3333, #ff6666);
      border-radius: 8px;
      transition: width 0.2s;
    }
    
    #ammo-bar-container {
      width: 150px;
      height: 12px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 6px;
      overflow: hidden;
      margin-top: 4px;
    }
    
    #ammo-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ffaa00, #ffcc33);
      border-radius: 6px;
      transition: width 0.2s;
    }
    
    #minimap {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 180px;
      height: 135px;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      overflow: hidden;
    }
    
    #minimap-canvas {
      width: 100%;
      height: 100%;
    }
    
    #player-list {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      padding: 12px;
      color: white;
      min-width: 160px;
    }
    
    #player-list h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.7;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, controls);
      padding-bottom: 4px;
    }
    
    .player-entry {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 0;
      font-size: 13px;
    }
    
    .player-name {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .team-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    
    .player-health {
      font-size: 11px;
      opacity: 0.7;
    }
    
    #chat-box {
      position: absolute;
      bottom: 80px;
      left: 20px;
      width: 350px;
    }
    
    #chat-messages {
      max-height: 150px;
      overflow-y: auto;
      margin-bottom: 5px;
    }
    
    .chat-msg {
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 10px;
      border-radius: 4px;
      color: white;
      font-size: 13px;
      margin-bottom: 2px;
    }
    
    #chat-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 6px;
      padding: 8px 12px;
      color: white;
      font-size: 14px;
      outline: none;
    }
    
    #chat-input:focus {
      border-color: rgba(255, 255, 255, 0.6);
    }
    
    #chat-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }
    
    #death-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(139, 0, 0, 0.4);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 20;
    }
    
    #death-screen.active {
      display: flex;
    }
    
    #death-screen h1 {
      color: white;
      font-size: 48px;
      text-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
      margin-bottom: 20px;
    }
    
    #death-screen p {
      color: rgba(255, 255, 255, 0.8);
      font-size: 18px;
    }
    
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 100;
    }
    
    /* Login / Welcome screen */
    #login-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 100;
    }
    
    #login-screen h1 {
      color: white;
      font-size: 42px;
      margin-bottom: 8px;
      text-shadow: 0 0 30px rgba(74, 158, 255, 0.5);
    }
    
    #login-screen .subtitle {
      color: rgba(255, 255, 255, 0.5);
      font-size: 16px;
      margin-bottom: 40px;
    }
    
    .login-form {
      background: rgba(0, 0, 0, 0.4);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 36px 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      min-width: 360px;
    }
    
    .login-form label {
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      align-self: flex-start;
    }
    
    .login-form input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: white;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    
    .login-form input[type="number"] {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: white;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    
    .login-form input[type="text"]:focus {
      border-color: rgba(74, 158, 255, 0.6);
    }
    
    .color-picker {
      display: flex;
      gap: 20px;
      align-items: center;
      justify-content: center;
    }
    
    #color-wheel-canvas {
      border-radius: 50%;
      cursor: crosshair;
      width: 160px;
      height: 160px;
    }
    
    .color-preview {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    
    #color-preview-swatch {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.5);
    }
    
    .color-presets {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    
    .color-preset-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }
    
    .color-preset-btn:hover {
      transform: scale(1.2);
      border-color: white;
    }
    
    #map-selector {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-height: 140px;
      overflow-y: auto;
    }
    
    .map-option {
      background: rgba(255, 255, 255, 0.06);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    
    .map-option:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(74, 158, 255, 0.5);
    }
    
    .map-option.selected {
      background: rgba(74, 158, 255, 0.15);
      border-color: #4a9eff;
    }
    
    .map-name {
      color: white;
      font-size: 14px;
      font-weight: bold;
    }
    
    .map-desc {
      color: rgba(255, 255, 255, 0.5);
      font-size: 11px;
      margin-top: 2px;
    }
    
    #join-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #4a9eff, #3a7edf);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    
    #join-btn:hover {
      background: linear-gradient(135deg, #5aaaff, #4a9eff);
    }
    
    #join-btn:active {
      transform: scale(0.97);
    }
    
    #join-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Editor link */
    .editor-btn {
      display: inline-block;
      margin-bottom: 16px;
      padding: 8px 20px;
      background: rgba(74, 255, 139, 0.15);
      border: 2px solid rgba(74, 255, 139, 0.4);
      border-radius: 8px;
      color: #4aff8b;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      transition: all 0.2s;
    }

    .editor-btn:hover {
      background: rgba(74, 255, 139, 0.25);
      border-color: #4aff8b;
      transform: scale(1.03);
    }

    /* Lobby list */
    #lobby-list-container {
      max-height: 260px;
      overflow-y: auto;
      margin-bottom: 12px;
    }

    .lobby-item {
      background: rgba(255, 255, 255, 0.04);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .lobby-item:hover {
      background: rgba(74, 158, 255, 0.1);
      border-color: rgba(74, 158, 255, 0.4);
    }

    .lobby-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .lobby-item-name {
      font-weight: bold;
      font-size: 14px;
      color: white;
    }

    .lobby-item-id {
      font-family: monospace;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.3);
    }

    .lobby-item-stats {
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
    }

    .lobby-item-stats span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .lobby-status-playing { color: #4aff8b; }
    .lobby-status-voting { color: #ffcc33; }
    .lobby-status-waiting { color: rgba(255, 255, 255, 0.4); }

    /* Primary buttons */
    .primary-btn {
      padding: 8px 16px;
      background: rgba(74, 158, 255, 0.2);
      border: 1px solid rgba(74, 158, 255, 0.4);
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s;
    }

    .primary-btn:hover {
      background: rgba(74, 158, 255, 0.35);
      border-color: rgba(74, 158, 255, 0.6);
    }

    /* Lobby map selector */
    #lobby-map-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .lobby-map-btn {
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.6);
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s;
    }

    .lobby-map-btn:hover {
      background: rgba(74, 158, 255, 0.15);
      border-color: rgba(74, 158, 255, 0.3);
    }

    .lobby-map-btn.selected {
      background: rgba(74, 158, 255, 0.3);
      border-color: #4a9eff;
      color: white;
    }

    .controls-hint {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 8px;
      padding: 12px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 11px;
      line-height: 1.6;
    }
    
    .controls-hint kbd {
      background: rgba(255, 255, 255, 0.15);
      padding: 2px 6px;
      border-radius: 3px;
      font-family: monospace;
      color: white;
    }
    
    /* Weapon HUD — shows unlocked weapons with key bindings */
    #weapon-hud {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      align-items: center;
    }
    
    .weapon-slot {
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 4px 8px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 11px;
      text-align: center;
      min-width: 50px;
      transition: all 0.15s;
    }
    
    .weapon-slot.active {
      border-color: rgba(255, 255, 255, 0.6);
      color: white;
      background: rgba(0, 0, 0, 0.8);
      transform: scale(1.05);
    }
    
    .weapon-slot .key {
      font-size: 9px;
      opacity: 0.6;
      display: block;
      margin-bottom: 2px;
    }
    
    .weapon-slot .name {
      font-weight: bold;
      font-size: 10px;
    }

    .weapon-slot .ammo {
      display: block;
      font-size: 9px;
      opacity: 0.7;
      margin-top: 1px;
    }

    /* Music toggle notification */
    #music-toggle-notif {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      padding: 16px 32px;
      color: white;
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      z-index: 50;
      display: none;
      pointer-events: none;
    }
    
    /* Round timer */
    #round-timer {
      display: none;
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      padding: 8px 20px;
      color: white;
      font-size: 24px;
      font-weight: bold;
      font-family: monospace;
    }

    /* Round end overlay */
    #round-end-overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.9);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      padding: 20px 40px;
      color: white;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      z-index: 50;
      display: none;
    }
    
    /* Voting UI */
    #vote-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10, 10, 30, 0.97);
      border: 2px solid #4a9eff;
      border-radius: 16px;
      padding: 24px;
      min-width: 360px;
      max-width: 500px;
      z-index: 40;
      display: none;
      pointer-events: auto;
    }
    
    .vote-header {
      text-align: center;
      margin-bottom: 16px;
    }
    
    .vote-header h3 {
      color: white;
      font-size: 20px;
      margin: 0 0 4px 0;
    }
    
    .vote-timer {
      color: #ffcc00;
      font-size: 16px;
      font-weight: bold;
      font-family: monospace;
    }
    
    .vote-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .vote-option {
      background: rgba(255, 255, 255, 0.06);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 12px 16px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.15s, border-color 0.15s;
      pointer-events: auto;
    }
    
    .vote-option:hover {
      background: rgba(74, 158, 255, 0.15);
      border-color: #4a9eff;
    }
    
    .vote-name {
      color: white;
      font-size: 15px;
      font-weight: bold;
    }
    
    .vote-count {
      color: rgba(255, 255, 255, 0.6);
      font-size: 13px;
    }
    
    /* Admin map selector */
    #admin-map-selector {
      position: fixed;
      top: 60px;
      right: 15px;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid rgba(74, 158, 255, 0.5);
      border-radius: 12px;
      padding: 16px;
      min-width: 220px;
      z-index: 35;
      display: none;
    }
    
    #admin-map-selector h4 {
      color: #4a9eff;
      font-size: 13px;
      margin: 0 0 10px 0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .admin-map-btn {
      display: block;
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 8px 12px;
      color: white;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
      margin-bottom: 4px;
      transition: background 0.15s, border-color 0.15s;
    }
    
    .admin-map-btn:hover {
      background: rgba(74, 158, 255, 0.15);
      border-color: #4a9eff;
    }
    
    .admin-map-btn.current {
      border-color: #4aff8b;
      color: #4aff8b;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  
  <div id="ui-overlay">
    <!-- HUD -->
    <div id="hud" style="display: none;">
      <div class="hud-item">
        <div class="label">Health</div>
        <div id="health-bar-container"><div id="health-bar"></div></div>
      </div>
      <div class="hud-item">
        <div class="label" id="weapon-label">Gun</div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:4px;">
          <div id="ammo-bar-container"><div id="ammo-bar"></div></div>
          <span id="ammo-count" style="font-size:16px;font-weight:bold;color:white;min-width:50px;text-align:right;">40</span>
        </div>
      </div>
    </div>
    
    <!-- Round Timer -->
    <div id="round-timer">05:00</div>
    
    <!-- Voting UI -->
    <div id="vote-container"></div>
    
    <!-- Admin Map Selector -->
    <div id="admin-map-selector" style="display:none;">
      <h4>Select Map</h4>
      <div id="admin-map-buttons"></div>
    </div>
    
    <!-- Round End Overlay -->
    <div id="round-end-overlay"></div>
    
    <!-- Minimap -->
    <div id="minimap" style="display: none;">
      <canvas id="minimap-canvas" width="180" height="135"></canvas>
    </div>
    
    <!-- Player List -->
    <div id="player-list" style="display: none;">
      <h3>Players</h3>
      <div id="players-container"></div>
    </div>
    
    <!-- Chat -->
    <div id="chat-box" style="display: none;">
      <div id="chat-messages"></div>
      <input type="text" id="chat-input" placeholder="Press Enter to chat, Esc to close..." maxlength="128">
    </div>
    
    <!-- Weapon HUD — shows unlocked weapons with key bindings -->
    <div id="weapon-hud" style="display: none;"></div>
    
    <!-- Music toggle notification -->
    <div id="music-toggle-notif"></div>
    
    <!-- Controls hint -->
    <div class="controls-hint" style="display: none;">
      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move<br>
      <kbd>Mouse</kbd> Aim & Shoot (LMB)<br>
      <kbd>RClick</kbd> Grapple Hook<br>
      <kbd>1-5</kbd> Switch Weapons<br>
      <kbd>O</kbd> Toggle Music<br>
      <kbd>E</kbd> Map Editor<br>
      <kbd>Enter</kbd> Chat / <kbd>R</kbd> Respawn
    </div>
  </div>
  
  <!-- Death screen -->
  <div id="death-screen">
    <h1>YOU DIED</h1>
    <p>Press R to respawn</p>
  </div>
  
  <!-- Login / Welcome screen -->
  <div id="login-screen">
    <h1>WARena</h1>
    <p class="subtitle">Choose a lobby or create your own</p>

    <!-- Editor link -->
    <a href="/editor" id="editor-link" class="editor-btn">🗺️ Map Editor</a>

    <!-- Lobby selection phase -->
    <div id="lobby-phase" class="login-form">
      <div style="display:flex;gap:8px;margin-bottom:16px;">
        <button id="btn-list-lobbies" class="primary-btn">Refresh Lobbies</button>
        <button id="btn-create-lobby" class="primary-btn">+ Create Lobby</button>
      </div>

      <!-- Lobby list -->
      <div id="lobby-list-container">
        <p style="color:rgba(255,255,255,0.4);text-align:center;padding:20px;">Loading lobbies...</p>
      </div>

      <!-- Create lobby form (hidden initially) -->
      <div id="create-lobby-form" style="display:none;margin-top:16px;">
        <label>Create New Lobby</label>
        <input type="text" id="lobby-name-input" placeholder="Lobby name..." maxlength="40" style="width:100%;padding:8px 12px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:white;border-radius:4px;margin-bottom:8px;">
        <label>Map</label>
        <div id="lobby-map-selector" style="margin-bottom:12px;"></div>
        <button id="btn-confirm-create-lobby" class="primary-btn">Create & Join</button>
      </div>
    </div>

    <!-- Name + color phase (shown after selecting a lobby) -->
    <div id="identity-phase" class="login-form" style="display:none;">
      <p style="color:rgba(255,255,255,0.6);margin-bottom:12px;font-size:13px;" id="selected-lobby-info"></p>

      <div style="width:100%">
        <label for="player-name">Player Name</label>
        <input type="text" id="player-name" placeholder="Enter your name..." maxlength="24" autocomplete="off">
      </div>
      <div style="width:100%;margin-top:8px;">
        <label for="round-time-input">Round Duration (seconds)</label>
        <input type="number" id="round-time-input" value="300" min="30" max="3600" step="30" placeholder="300">
      </div>
      <div style="width:100%;margin-top:8px;">
        <label>Team Color</label>
        <div class="color-picker">
          <canvas id="color-wheel-canvas" width="160" height="160"></canvas>
          <div class="color-preview">
            <div id="color-preview-swatch"></div>
            <div class="color-presets">
              <div class="color-preset-btn" data-hex="#4a9eff" style="background:#4a9eff;" title="Blue"></div>
              <div class="color-preset-btn" data-hex="#ff4a4a" style="background:#ff4a4a;" title="Red"></div>
              <div class="color-preset-btn" data-hex="#4aff8b" style="background:#4aff8b;" title="Green"></div>
              <div class="color-preset-btn" data-hex="#ffff4a" style="background:#ffff4a;" title="Yellow"></div>
              <div class="color-preset-btn" data-hex="#ff4aff" style="background:#ff4aff;" title="Pink"></div>
            </div>
          </div>
        </div>
      </div>
      <button id="join-btn" class="primary-btn">Join Lobby</button>
      <button id="btn-back-to-lobbies" style="margin-top:8px;background:none;border:1px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.6);padding:6px 14px;border-radius:4px;cursor:pointer;">← Back to Lobbies</button>
    </div>
  </div>

  <!-- Loading screen (for reconnect) -->
  <div id="loading-screen" style="display:none;">
    <h1>WARena</h1>
    <div class="spinner"></div>
  </div>

  <script type="module">
    // Load shared constants as global for browser
    import { MAP_REGISTRY, CONSTANTS } from '../shared/constants.js';
    window.MAP_REGISTRY = MAP_REGISTRY;
    window.CONSTANTS = CONSTANTS;
  </script>

  <script src="game.js"></script>
</body>
</html>
